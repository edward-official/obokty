services:

  # ============================================================
  # Nginx (리버스 프록시 + SSL)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: obokty_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 설정 파일
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt SSL 인증서 (Certbot이 발급 후 이 경로에 저장)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot 인증 챌린지용 웹루트
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - auth_service
      - game_service
      - frontend
    restart: always

  # ============================================================
  # Auth Service (FastAPI)
  # ============================================================
  auth_service:
    build: ./backend/auth_service
    container_name: obokty_auth
    env_file: .env.production
    environment:
      # AWS RDS 엔드포인트를 .env.production에 정의
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/${POSTGRES_DB}
    # 내부 통신만 사용 (Nginx가 프록시), 외부에 포트 노출하지 않음
    expose:
      - "8000"
    restart: always

  # ============================================================
  # Game Service (FastAPI + WebSocket)
  # ============================================================
  game_service:
    build: ./backend/game_service
    container_name: obokty_game
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RDS_HOST}:5432/${POSTGRES_DB}
    expose:
      - "8000"
    restart: always

  # ============================================================
  # Frontend (Next.js)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      args:
        # 빌드 타임에 환경변수를 주입 (NEXT_PUBLIC_ 변수는 빌드 시 번들에 포함됨)
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
        NEXT_PUBLIC_GAME_API_URL: ${NEXT_PUBLIC_GAME_API_URL}
        NEXT_PUBLIC_GAME_WS_URL: ${NEXT_PUBLIC_GAME_WS_URL}
    container_name: obokty_frontend
    expose:
      - "3000"
    restart: always

# 로컬 개발용 postgres_data 볼륨 제거 (DB는 AWS RDS 사용)
