services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16
    container_name: obokty_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Auth Service (FastAPI)
  # ============================================================
  auth_service:
    build: ./backend/auth_service
    container_name: obokty_auth
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/auth_service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # Game Service (FastAPI + WebSocket)
  # ============================================================
  game_service:
    build: ./backend/game_service
    container_name: obokty_game
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/game_service:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # Frontend (Next.js)
  # ============================================================
  frontend:
    build: ./frontend
    container_name: obokty_frontend
    environment:
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:8001
      NEXT_PUBLIC_GAME_API_URL: http://localhost:8002
      NEXT_PUBLIC_GAME_WS_URL: ws://localhost:8002
    ports:
      - "3000:3000"
    depends_on:
      - auth_service
      - game_service
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
