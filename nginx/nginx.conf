    #     listen 443 ssl;
    #     server_name obokty.cloud www.obokty.cloud;
    #
    #     ssl_certificate /etc/letsencrypt/live/obokty.cloud/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/obokty.cloud/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     client_max_body_size 10M;
