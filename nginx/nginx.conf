user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 업스트림 서버 정의 (docker-compose 서비스명으로 연결)
    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth_service:8000;
    }

    upstream game_service {
        server game_service:8000;
    }

    # ============================================================
    # [1단계] HTTP 전용 서버 (80 포트)
    # Certbot SSL 인증서 발급 전까지 이 블록만 활성화합니다.
    # 인증서 발급 후 아래 HTTPS 블록을 활성화하고 이 블록을 리다이렉트로 교체하세요.
    # ============================================================
    server {
        listen 80;
        server_name obokty.cloud www.obokty.cloud;

        # Certbot 인증 챌린지 경로 (인증서 발급 시 필수)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ----------------------------------------------------------
        # Auth Service: /api/auth/, /api/couple/ 경로
        # ----------------------------------------------------------
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/couple/ {
            proxy_pass http://auth_service/couple/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # Game Service - HTTP (/api/game/ 경로)
        # ----------------------------------------------------------
        location /api/game/ {
            proxy_pass http://game_service/game/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # Game Service - WebSocket (/ws 경로)
        # ----------------------------------------------------------
        location /ws/ {
            proxy_pass http://game_service/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------
        # Frontend (Next.js) - 나머지 모든 경로 (/)
        # ----------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # [2단계] HTTPS 서버 (443 포트)
    # Certbot으로 인증서 발급 완료 후 아래 주석을 해제하세요.
    # 그리고 위 [1단계] server 블록의 location / 를
    # "return 301 https://$host$request_uri;" 로 교체하세요.
    # ============================================================
