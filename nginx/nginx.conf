user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 업스트림 서버 정의 (docker-compose 서비스명으로 연결)
    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth_service:8000;
    }

    upstream game_service {
        server game_service:8000;
    }

    # ============================================================
    # HTTP → HTTPS 리다이렉트 (80 포트)
    # ============================================================
    server {
        listen 80;
        server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

        # Let's Encrypt 인증서 발급을 위한 경로 (Certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 모든 HTTP 요청을 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # HTTPS 메인 서버 (443 포트)
    # ============================================================
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

        # SSL 인증서 경로 (Certbot이 자동 발급/갱신)
        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;

        # 권장 SSL 보안 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # 클라이언트 요청 최대 크기 (파일 업로드 등)
        client_max_body_size 10M;

        # ----------------------------------------------------------
        # Auth Service (/auth 경로)
        # ----------------------------------------------------------
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # Game Service - HTTP (/game 경로)
        # ----------------------------------------------------------
        location /game/ {
            proxy_pass http://game_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------
        # Game Service - WebSocket (/ws 경로)
        # ----------------------------------------------------------
        location /ws/ {
            proxy_pass http://game_service/ws/;
            proxy_http_version 1.1;

            # WebSocket 핸드셰이크를 위한 필수 헤더
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 연결 유지 타임아웃 (초 단위)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------
        # Frontend (Next.js) - 나머지 모든 경로 (/)
        # ----------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
